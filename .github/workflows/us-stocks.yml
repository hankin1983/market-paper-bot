name: US stocks paper scanner
on:
  workflow_dispatch:
  schedule:
    - cron: '13,43 13-21 * * 1-5'
permissions:
  contents: write
concurrency:
  group: kraken-paper-trading
  cancel-in-progress: false
jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test stock accounting and adapter
        run: python -m unittest -v test_equities.py test_equities_forward.py test_alpaca_stocks.py
      - name: Fetch Alpaca prices and scan fictional stock account
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python alpaca_stocks.py
      - name: Save US stock paper ledger
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- us_stocks_account.json
          if ! git diff --cached --quiet; then
            git commit -m 'Save US stock paper ledger'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Save recovery ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-stock-ledger-${{ github.run_id }}
          path: us_stocks_account.json
