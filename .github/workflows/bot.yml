
name: AI Market Paper Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

jobs:
  scan-markets:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Get bot files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run market scanner
        run: python bot.py
