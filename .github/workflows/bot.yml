
name: Kraken Paper Trading Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

concurrency:
  group: kraken-paper-trading
  cancel-in-progress: false

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get latest bot files
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run automatic paper trading bot
        run: python bot.py

      - name: Save trading account and price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add account.json price_history.json

          if git diff --cached --quiet; then
            echo "No changes to save."
            exit 0
          fi

          git commit -m "Update Kraken paper trading records"

          # Save only if nobody has changed the branch.
          # Never overwrite newer account data.
          if git push origin HEAD:main; then
            echo "Trading records saved successfully."
          else
            echo "SAVE CONFLICT: Remote data changed."
            echo "Stopping to protect trading history."
            exit 1
          fi
