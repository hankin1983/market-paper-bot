
name: Kraken Paper Trading Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

concurrency:
  group: kraken-paper-trading
  cancel-in-progress: false

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Get bot files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run automatic paper trading bot
        run: python bot.py

      - name: Save trading account and price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add account.json price_history.json

          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update Kraken paper trading records"
            git push
          fi
